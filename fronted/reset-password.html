
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reset Password - JobTrack</title>

    <link rel="stylesheet"
        href="style.css">

    <link rel="icon"
        type="image/x-icon"
        href="favicon.ico.png">

</head>


<body class="auth-body">

    <div class="auth-container">

        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                <span>Job</span>Track
            </div>


            <!-- Heading -->
            <h1>Reset Password 🔐</h1>


            <p class="auth-subtitle">
                Create a new password for your JobTrack account.
            </p>


            <!-- Reset Password Form -->
            <form id="resetPasswordForm">

                <!-- New Password -->
                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('newPassword', this)"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmNewPassword">
                        Confirm New Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmNewPassword"
                            placeholder="Confirm new password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('confirmNewPassword', this)"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Reset Button -->
                <button
                    type="submit"
                    class="auth-btn"
                >
                    Reset Password
                </button>

            </form>


            <!-- Message -->
            <p
                id="resetMessage"
                style="
                    margin-top: 15px;
                    text-align: center;
                "
            ></p>


            <!-- Login -->
            <p class="auth-footer">

                Remember your password?

                <a href="login.html">
                    Login
                </a>

            </p>


            <!-- Home -->
            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </div>


    <!-- Auth JavaScript -->
    <script src="auth.js"></script>


    <!-- Reset Password JavaScript -->
    <script>

        // =====================================================
        // RESET PASSWORD
        // =====================================================

        const resetPasswordForm =
            document.getElementById(
                "resetPasswordForm"
            );


        if (resetPasswordForm) {

            resetPasswordForm.addEventListener(
                "submit",
                async function (e) {

                    e.preventDefault();


                    // Get token from URL
                    const urlParams =
                        new URLSearchParams(
                            window.location.search
                        );


                    const token =
                        urlParams.get("token");


                    const password =
                        document.getElementById(
                            "newPassword"
                        ).value;


                    const confirmPassword =
                        document.getElementById(
                            "confirmNewPassword"
                        ).value;


                    const message =
                        document.getElementById(
                            "resetMessage"
                        );


                    const submitButton =
                        resetPasswordForm.querySelector(
                            "button[type='submit']"
                        );


                    // Check token
                    if (!token) {

                        message.textContent =
                            "Invalid or missing password reset link.";

                        message.style.color =
                            "red";

                        return;
                    }


                    // Check password match
                    if (
                        password !==
                        confirmPassword
                    ) {

                        message.textContent =
                            "Passwords do not match ❌";

                        message.style.color =
                            "red";

                        return;
                    }


                    // Minimum password length
                    if (password.length < 6) {

                        message.textContent =
                            "Password must be at least 6 characters.";

                        message.style.color =
                            "red";

                        return;
                    }


                    // Disable button
                    submitButton.disabled =
                        true;

                    submitButton.textContent =
                        "Resetting...";

                    message.textContent =
                        "";


                    try {

                        const response =
                            await fetch(
                                "https://job-track-lpy1.onrender.com/api/auth/reset-password",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body: JSON.stringify({
                                        token: token,
                                        password: password
                                    })
                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            message.textContent =
                                data.message ||
                                "Password reset failed ❌";

                            message.style.color =
                                "red";


                            submitButton.disabled =
                                false;

                            submitButton.textContent =
                                "Reset Password";

                            return;
                        }


                        // Success
                        message.textContent =
                            "Password reset successfully ✅";

                        message.style.color =
                            "green";


                        submitButton.textContent =
                            "Password Reset ✓";


                        // Redirect to login
                        setTimeout(
                            function () {

                                window.location.href =
                                    "login.html";

                            },
                            2000
                        );


                    } catch (error) {

                        console.error(
                            "Reset Password Error:",
                            error
                        );


                        message.textContent =
                            "Server connection failed ❌";

                        message.style.color =
                            "red";


                        submitButton.disabled =
                            false;

                        submitButton.textContent =
                            "Reset Password";
                    }

                }
            );

        }

    </script>

</body>

</html>
